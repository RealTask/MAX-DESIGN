<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MAX-DESIGN \xB7 Ship intentional UI</title>
<meta name="description" content="One installable UI/UX skill that teaches AI coding agents to discover, design, critique and verify interfaces." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BioRhyme:wght@400;700;800&family=Cabin:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Caveat:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" />
<style>
/* MAX-DESIGN preview \xB7 "the press proof"
   Plum = brand ink \xB7 Red = critique pen \xB7 Green = verified \xB7 Orange = registration \xB7 Blush = tint */
.md-root{
  --paper:#f5f1f6; --sheet:#fdfbfd; --ink:#2a1b2f; --ink-2:#4b3a51; --muted:#6c5b72;
  --plum:#663171; --plum-deep:#47204f; --plum-tint:#ede3ef; --red:#cf3a36; --orange:#ea7428;
  --blush:#e2998a; --green:#0c7156; --green-tint:#dcefe7; --rule:rgba(102,49,113,.16);
  --term:#1f1424; --term-2:#2c1e33;
  --display:"BioRhyme",Georgia,serif; --body:"Cabin",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace; --pen:"Caveat","Bradley Hand",cursive;
  --ease:cubic-bezier(.2,.7,.1,1);
  background:var(--paper); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.55;
  -webkit-font-smoothing:antialiased; min-height:100vh; overflow-x:hidden;
}
.md-root *,.md-root *::before,.md-root *::after{box-sizing:border-box}
.md-root a{color:inherit}
.md-root ::selection{background:var(--plum);color:#fff}
.md-root :focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}
.skip{position:absolute;left:-999px;top:8px;background:var(--plum);color:#fff;padding:10px 16px;border-radius:8px;z-index:50}
.skip:focus{left:16px}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:30;background:color-mix(in oklab,var(--paper) 86%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid transparent;transition:border-color .3s}
.nav.scrolled{border-bottom-color:var(--rule)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.mark svg{width:26px;height:26px}
.nav ul{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.nav ul a{display:block;padding:8px 14px;border-radius:999px;text-decoration:none;font-size:15px;font-weight:500;color:var(--ink-2);transition:background .2s,color .2s}
.nav ul a:hover{background:var(--plum-tint);color:var(--plum-deep)}
.gh{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--ink);color:#fff!important;text-decoration:none;font-size:15px;font-weight:600;transition:background .2s,transform .2s var(--ease)}
.gh:hover{background:var(--plum);transform:translateY(-1px)}
.gh svg{width:17px;height:17px}

/* ---------- hero / proof sheet ---------- */
.hero{padding:28px 0 80px}
.sheet{position:relative;background:var(--sheet);border-radius:4px;padding:72px 64px 64px;box-shadow:0 1px 0 var(--rule),0 30px 60px -40px rgba(71,32,79,.35)}
.crop{position:absolute;width:28px;height:28px;pointer-events:none}
.crop::before,.crop::after{content:"";position:absolute;background:var(--ink);opacity:.55}
.crop::before{width:1px;height:20px}.crop::after{height:1px;width:20px}
.crop.tl{left:-14px;top:-14px}.crop.tl::before{left:14px;top:-8px}.crop.tl::after{top:14px;left:-8px}
.crop.tr{right:-14px;top:-14px}.crop.tr::before{right:14px;top:-8px}.crop.tr::after{top:14px;right:-8px}
.crop.bl{left:-14px;bottom:-14px}.crop.bl::before{left:14px;bottom:-8px}.crop.bl::after{bottom:14px;left:-8px}
.crop.br{right:-14px;bottom:-14px}.crop.br::before{right:14px;bottom:-8px}.crop.br::after{bottom:14px;right:-8px}
.reg{position:absolute;width:30px;height:30px;color:var(--ink);opacity:.5}
.reg.l{left:18px;top:50%;margin-top:-15px}.reg.r{right:18px;top:50%;margin-top:-15px}
.colorbar{position:absolute;top:22px;left:64px;right:64px;display:flex;height:14px;gap:2px;overflow:hidden;border-radius:2px}
.colorbar i{flex:1;display:block}
.colorbar::after{content:"";position:absolute;top:-4px;bottom:-4px;width:46px;border:1.5px solid var(--ink);border-radius:3px;animation:densi 9s var(--ease) infinite;opacity:.7}
@keyframes densi{0%{left:-50px}55%,100%{left:calc(100% + 10px)}}
.slug{position:absolute;bottom:22px;left:64px;right:64px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.hero-grid>*,.cat-grid>*,.inst-grid>*{min-width:0}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--plum)}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-tint)}
h1.headline{font-family:var(--display);font-weight:800;font-size:clamp(54px,7vw,96px);line-height:.98;letter-spacing:-.035em;margin:18px 0 0;color:var(--ink)}
h1 .line{display:block}
h1 .line.mid{padding-top:.34em}
.struck{position:relative;display:inline-block;color:var(--ink-2)}
.struck::after{content:"";position:absolute;left:-4%;right:-4%;top:54%;height:.085em;background:var(--red);border-radius:4px;transform:rotate(-3deg) scaleX(0);transform-origin:left center;animation:strike .55s .9s var(--ease) forwards}
@keyframes strike{to{transform:rotate(-3deg) scaleX(1)}}
.insert{position:absolute;left:50%;top:-.5em;transform:translateX(-50%) rotate(-4deg);font-family:var(--pen);font-weight:700;font-size:.56em;letter-spacing:0;color:var(--red);white-space:nowrap;clip-path:inset(0 100% 0 0);animation:write .9s 1.45s steps(14,end) forwards}
.insert::before{display:none;content:"";position:absolute;left:50%;bottom:-.95em;width:.5em;height:.5em;border-left:3px solid var(--red);border-top:3px solid var(--red);transform:translateX(-50%) rotate(45deg);border-radius:2px}
@keyframes write{to{clip-path:inset(-40% -10% -60% -10%)}}
.lede{font-size:20px;line-height:1.5;color:var(--ink-2);max-width:30ch;margin:28px 0 0}
.lede b{color:var(--ink);font-weight:600}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:36px}
.cmd{max-width:100%;display:inline-flex;align-items:center;gap:0;background:var(--term);color:#f3e9f5;border-radius:12px;font-family:var(--mono);font-size:15px;box-shadow:0 14px 30px -18px rgba(31,20,36,.7)}
.cmd code{padding:14px 4px 14px 18px;overflow-x:auto;white-space:nowrap;min-width:0}
.cmd code .p{color:var(--blush);margin-right:10px;user-select:none}
.copy{appearance:none;border:0;margin:6px;background:var(--term-2);color:#f3e9f5;font:600 14px var(--body);padding:9px 14px;border-radius:8px;cursor:pointer;min-width:74px;transition:background .2s}
.copy:hover{background:var(--plum)}
.copy.ok{background:var(--green)}
.link-arrow{display:inline-flex;align-items:center;gap:8px;font-weight:600;text-decoration:none;color:var(--plum);padding:12px 6px;border-bottom:2px solid transparent;transition:border-color .2s,gap .2s var(--ease)}
.link-arrow:hover{border-bottom-color:var(--plum);gap:12px}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:34px;font-size:15px;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:8px}
.meta svg{width:16px;height:16px;color:var(--plum)}

/* proof card */
.proof{position:relative}
.proof-frame{position:relative;display:grid;grid-template-columns:1fr 132px;gap:0;background:#fff;border:1px solid var(--rule);border-radius:16px;overflow:visible;box-shadow:0 24px 50px -30px rgba(71,32,79,.45)}
.proof-label{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px dashed var(--rule);font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.proof-label .state{display:inline-flex;align-items:center;gap:7px;color:var(--red);transition:color .4s}
.proof-label .state::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.proof[data-phase="fixed"] .proof-label .state{color:var(--green)}
.canvas{position:relative;padding:22px 22px 26px;min-height:332px;border-right:1px dashed var(--rule)}
.margin{position:relative}
.layer{transition:opacity .5s var(--ease),transform .5s var(--ease),filter .5s}
.fixed{position:absolute;inset:22px 22px 26px;opacity:0;transform:translateY(10px);pointer-events:none}
.proof[data-phase="fixed"] .draft{opacity:0;transform:translateY(-8px);filter:blur(3px)}
.proof[data-phase="fixed"] .fixed{opacity:1;transform:none;pointer-events:auto}
/* draft (deliberately generic) */
.d-nav{display:flex;gap:6px;margin-bottom:22px}.d-nav i{height:7px;border-radius:4px;background:#e7e1ea;display:block}
.d-blob{height:64px;border-radius:14px;background:linear-gradient(120deg,#c9b6f2,#f4b7d8,#b9e3f5);margin-bottom:18px;opacity:.85}
.flag{position:relative;display:inline-block}
.flag svg.ring{position:absolute;left:-10px;top:-8px;width:calc(100% + 20px);height:calc(100% + 16px);overflow:visible;pointer-events:none}
.flag svg.ring path{fill:none;stroke:var(--red);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420;transition:stroke-dashoffset .55s var(--ease)}
.flag.on svg.ring path{stroke-dashoffset:0}
.d-h{font:700 23px/1.15 var(--body);color:#3b3540;letter-spacing:-.01em;margin:0}
.d-stat{font:600 15px var(--body);color:#9a8fa0;margin:12px 0 18px}
.d-input{display:block;width:100%;border:1px solid #e7e1ea;border-radius:10px;padding:11px 12px;color:#b9b0bd;font-size:15px;margin-bottom:10px}
.d-btn{display:inline-block;background:#eadff7;color:#c4b2d6;font-weight:600;font-size:15px;padding:10px 18px;border-radius:999px}
.note{position:absolute;left:12px;right:8px;font-family:var(--pen);font-weight:700;font-size:21px;line-height:1.02;color:var(--red);opacity:0;transform:translateX(-6px) rotate(-2deg);transition:opacity .35s,transform .45s var(--ease)}
.note.on{opacity:1;transform:rotate(-2deg)}
.proof[data-phase="fixed"] .note{opacity:0;transform:translateX(8px) rotate(-2deg)}
/* fixed */
.f-eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--plum)}
.f-h{font:800 25px/1.12 var(--display);letter-spacing:-.02em;color:var(--ink);margin:10px 0 10px}
.f-p{font-size:15px;color:var(--ink-2);margin:0 0 16px}
.f-label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.f-input{display:block;width:100%;border:1.5px solid #cdbfd2;border-radius:10px;padding:10px 12px;font-size:15px;color:var(--muted);margin-bottom:6px;background:#fff}
.f-help{font-size:14px;color:var(--muted);margin-bottom:14px}
.f-btn{display:inline-flex;align-items:center;gap:8px;background:var(--plum);color:#fff;font-weight:600;font-size:15px;padding:11px 18px;border-radius:10px;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--orange)}
.stamp{position:absolute;right:-26px;bottom:18px;width:132px;height:132px;border-radius:50%;border:3px solid var(--green);color:var(--green);display:grid;place-items:center;text-align:center;background:color-mix(in oklab,#fff 80%,transparent);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;line-height:1.35;transform:rotate(-14deg) scale(1.6);opacity:0;transition:transform .45s cubic-bezier(.3,1.6,.5,1),opacity .2s;pointer-events:none;z-index:2}
.stamp b{display:block;font-family:var(--display);font-size:19px;letter-spacing:.02em;font-weight:800}
.stamp::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1px dashed var(--green)}
.proof[data-phase="fixed"] .stamp{opacity:1;transform:rotate(-14deg) scale(1)}
.proof-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;font-size:14px;color:var(--muted)}
.rerun{white-space:nowrap;flex:none;appearance:none;border:1.5px solid var(--rule);background:var(--sheet);color:var(--plum-deep);font:600 14px var(--body);padding:9px 14px;border-radius:999px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;transition:border-color .2s,background .2s}
.rerun:hover{border-color:var(--plum);background:var(--plum-tint)}
.rerun svg{width:15px;height:15px}

/* ---------- sections ---------- */
section.block{padding:112px 0}
.kicker{font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--plum);display:flex;align-items:center;gap:12px}
.kicker::before{content:"";width:22px;height:2px;background:var(--orange)}
h2{font-family:var(--display);font-weight:800;font-size:clamp(38px,4.6vw,60px);line-height:1.03;letter-spacing:-.03em;margin:18px 0 0;max-width:16ch}
.sub{font-size:19px;color:var(--ink-2);max-width:46ch;margin:18px 0 0}

/* workflow */
.flow{margin-top:56px;background:var(--sheet);border-radius:20px;border:1px solid var(--rule);overflow:hidden}
.rail{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-bottom:1px solid var(--rule)}
.rail .ink{position:absolute;left:0;bottom:-1px;height:3px;background:var(--plum);transition:width .6s var(--ease)}
.stage{appearance:none;border:0;background:transparent;text-align:left;padding:22px 20px 20px;cursor:pointer;font:inherit;color:var(--muted);border-right:1px solid var(--rule);transition:background .25s,color .25s;position:relative}
.stage:last-child{border-right:0}
.stage:hover{background:var(--plum-tint);color:var(--ink)}
.stage .n{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.08em}
.stage .t{display:block;font-family:var(--display);font-weight:700;font-size:21px;margin-top:6px;letter-spacing:-.01em}
.stage[aria-selected="true"]{color:var(--ink);background:linear-gradient(var(--plum-tint),transparent 70%)}
.stage[aria-selected="true"] .n{color:var(--plum)}
.stage.done .n::after{content:" \u2713";color:var(--green)}
.panel{display:grid;grid-template-columns:1.3fr 1fr;gap:48px;padding:44px 44px 48px;min-height:260px}
.panel .say{font-family:var(--display);font-size:clamp(24px,2.4vw,32px);line-height:1.22;letter-spacing:-.02em;margin:0;color:var(--ink)}
.panel .say em{font-style:normal;color:var(--plum)}
.panel dl{margin:0;display:grid;gap:22px;align-content:start}
.panel dt{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.panel dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:13px;padding:6px 10px;border-radius:7px;background:var(--plum-tint);color:var(--plum-deep)}
.out{font-size:18px;font-weight:600;color:var(--green);display:flex;align-items:center;gap:10px}
.out svg{width:20px;height:20px;flex:none}
.swap{animation:swap .5s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.flow-ctl{display:flex;align-items:center;gap:10px;padding:0 44px 28px;color:var(--muted);font-size:14px}
.flow-ctl button{appearance:none;border:1.5px solid var(--rule);background:transparent;border-radius:999px;padding:7px 14px;font:600 14px var(--body);color:var(--plum-deep);cursor:pointer}
.flow-ctl button:hover{border-color:var(--plum)}

/* swatch book */
.book{margin-top:56px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.swatch{position:relative;background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--rule);transition:transform .35s var(--ease),box-shadow .35s var(--ease);display:flex;flex-direction:column}
.swatch:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 22px 40px -26px rgba(71,32,79,.55)}
.swatch .chipc{height:96px;position:relative;display:flex;align-items:flex-end;padding:12px 14px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);font-family:var(--mono);font-size:12px;letter-spacing:.06em}
.swatch .chipc::after{content:"";position:absolute;right:14px;top:14px;width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(255,255,255,.75)}
.swatch.lead{grid-column:span 2}
.swatch.lead .chipc{height:96px}
.swatch .body{padding:16px 16px 18px}
.swatch h3{font-family:var(--mono);font-size:15px;font-weight:600;margin:0;color:var(--ink)}
.swatch p{margin:6px 0 0;font-size:15px;line-height:1.45;color:var(--ink-2)}
.swatch .uses{margin-top:auto;padding:0 16px 14px;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}

/* catalog terminal */
.cat{background:var(--term);color:#efe4f2}
.cat .kicker{color:#f4b4a6}
.cat h2{color:#fff}
.cat .sub{color:#cdbcd3}
.cat-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:start}
.term{margin-top:8px;background:#140c18;border:1px solid #3a2a41;border-radius:16px;overflow:hidden;box-shadow:0 40px 80px -40px #000}
.term-top{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid #2e2134;font-family:var(--mono);font-size:12px;color:#d6c6dc}
.term-top i{width:11px;height:11px;border-radius:50%;display:block}
.term-top span{margin-left:10px}
.qrow{display:flex;align-items:center;gap:10px;padding:16px 18px 10px;font-family:var(--mono);font-size:15px}
.qrow .p{color:#f4b4a6;white-space:nowrap}
.qrow input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:inherit;caret-color:var(--orange);padding:6px 0;border-bottom:1px dashed #4a3852}
.qrow input:focus{outline:none;border-bottom-color:var(--orange)}
.domains{display:flex;flex-wrap:wrap;gap:6px;padding:4px 18px 14px}
.domains button{appearance:none;border:1px solid #3a2a41;background:transparent;color:#cdbcd3;font:500 13px var(--mono);padding:6px 10px;border-radius:7px;cursor:pointer;transition:all .2s}
.domains button:hover{border-color:var(--blush);color:#fff}
.domains button[aria-pressed="true"]{background:var(--blush);border-color:var(--blush);color:#2a1b2f}
.results{border-top:1px solid #2e2134;max-height:430px;overflow:auto;padding:8px 0;font-family:var(--mono);font-size:14px}
.results .count{padding:8px 18px 4px;color:#d6c6dc;font-size:13px}
.res{padding:12px 18px;border-left:3px solid transparent;animation:swap .4s var(--ease) both}
.res:hover{background:#1d1222;border-left-color:var(--orange)}
.res .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.res .dom{color:#f6a46a;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.res .title{color:#fff;font-weight:600}
.res .score{margin-left:auto;color:#c6b5cc;font-size:12px}
.res .sum{color:#cdbcd3;font-family:var(--body);font-size:15px;margin-top:4px;line-height:1.45}
.res .tags{color:#d3c3d9;font-size:13px;margin-top:6px}
.res mark{background:none;color:var(--blush);text-decoration:underline;text-underline-offset:3px}
.empty{padding:28px 18px;color:#cdbcd3;font-family:var(--body);font-size:16px}
.empty button{appearance:none;background:none;border:0;color:var(--blush);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
.try{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.try button{appearance:none;background:#2c1e33;border:1px solid #3a2a41;color:#efe4f2;font:500 14px var(--mono);padding:8px 12px;border-radius:8px;cursor:pointer;transition:all .2s}
.try button:hover{border-color:var(--orange);color:#fff}
.disclaim{margin-top:20px;font-size:14px;color:#d6c6dc;max-width:40ch}

/* principles */
.rules{margin-top:56px;display:grid;grid-template-columns:1fr 1fr;gap:0 64px}
.rule{display:grid;grid-template-columns:34px 1fr;gap:14px;padding:22px 0;border-top:1px solid var(--rule)}
.rule svg{width:28px;height:28px;color:var(--green);margin-top:3px}
.rule svg path{stroke-dasharray:40;stroke-dashoffset:40;transition:stroke-dashoffset .6s var(--ease) .2s}
.rule.in svg path{stroke-dashoffset:0}
.rule h3{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.015em;margin:0}
.rule p{margin:4px 0 0;color:var(--ink-2);font-size:16px}

/* install */
.install{background:var(--sheet);border-top:1px solid var(--rule)}
.inst-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:56px;align-items:start}
.tabs{display:flex;gap:4px;background:var(--plum-tint);padding:4px;border-radius:12px;width:max-content;max-width:100%;flex-wrap:wrap}
.tabs button{appearance:none;border:0;background:transparent;font:600 15px var(--body);color:var(--plum-deep);padding:9px 16px;border-radius:9px;cursor:pointer;transition:background .2s,color .2s}
.tabs button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 2px 6px -2px rgba(71,32,79,.3)}
.codebox{position:relative;margin-top:16px;background:var(--term);border-radius:14px;color:#efe4f2;font-family:var(--mono);font-size:14.5px;line-height:1.75;overflow:hidden}
.codebox pre{margin:0;padding:22px 24px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.codebox .c{color:#d3c3d9}
.codebox .k{color:var(--blush)}
.codebox .copy{position:absolute;top:10px;right:10px}
.notes{margin-top:22px;display:grid;gap:12px;font-size:16px;color:var(--ink-2)}
.notes div{display:flex;gap:12px;align-items:flex-start}
.notes svg{width:18px;height:18px;color:var(--plum);flex:none;margin-top:4px}
.notes code{font-family:var(--mono);font-size:14px;background:var(--plum-tint);padding:1px 6px;border-radius:5px;color:var(--plum-deep)}

footer{padding:44px 0 56px;border-top:1px solid var(--rule);background:var(--sheet)}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;color:var(--muted);font-size:15px}
footer nav{display:flex;gap:20px}
footer a{text-decoration:none}footer a:hover{color:var(--plum)}

/* reveal */
.rv{opacity:0;transform:translateY(18px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.rv.in{opacity:1;transform:none}

@media (max-width:1020px){
  .hero-grid,.cat-grid,.inst-grid{grid-template-columns:1fr;gap:48px}
  .book{grid-template-columns:repeat(2,1fr)}
  .panel{grid-template-columns:1fr;gap:28px}
  .nav ul{display:none}
}
@media (max-width:720px){
  .wrap{padding:0 18px}
  .sheet{padding:60px 22px 56px}
  .colorbar,.slug{left:22px;right:22px}
  .reg{display:none}
  .rail{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stage{padding:16px 14px}.stage .t{font-size:18px}
  .qrow{flex-wrap:wrap}.qrow .p{white-space:normal}
  .proof-frame{grid-template-columns:1fr 92px}
  .stage{border-bottom:1px solid var(--rule)}
  .stage:nth-child(3n){border-right:0}
  .panel{padding:28px 22px 32px}
  .flow-ctl{padding:0 22px 24px}
  .rules{grid-template-columns:1fr}
  .book{grid-template-columns:1fr}
  .swatch.lead{grid-column:auto}
  .proof-frame{grid-template-columns:1fr 100px}
  .note{font-size:18px}
  .cmd{font-size:12px;max-width:100%}.cmd code{padding-left:12px}.copy{min-width:60px;padding:9px 10px}
  .cmd code{white-space:nowrap;overflow:auto}
  section.block{padding:80px 0}
  .stamp{right:-6px;width:112px;height:112px}
}
@media (prefers-reduced-motion:reduce){
  .md-root *,.md-root *::before,.md-root *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .colorbar::after{display:none}
}

/* ===== motion layer v2 ===== */
.halftone{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.md-root>header,.md-root>main,.md-root>footer{position:relative;z-index:1}
.nav{z-index:30!important}
/* hero lines rise */
h1 .line{opacity:0;transform:translateY(.45em);animation:rise .9s var(--ease) forwards}
h1 .line:nth-child(1){animation-delay:.1s}h1 .line:nth-child(2){animation-delay:.25s}h1 .line:nth-child(3){animation-delay:.4s}
@keyframes rise{to{opacity:1;transform:none}}
.eyebrow,.lede,.cta,.meta{opacity:0;animation:rise .8s var(--ease) forwards}
.eyebrow{animation-delay:0s}.lede{animation-delay:.55s}.cta{animation-delay:.7s}.meta{animation-delay:.85s}
.proof{opacity:0;animation:proofIn 1s .35s var(--ease) forwards}
@keyframes proofIn{from{opacity:0;transform:translateY(24px) rotate(1.2deg)}to{opacity:1;transform:none}}
.eyebrow .dot{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--green-tint)}50%{box-shadow:0 0 0 9px rgba(12,113,86,.08)}}
/* registration + crop marks */
.reg{animation:spin 24s linear infinite}
.reg.r{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.crop::before{transform-origin:top;animation:cropY .7s .2s var(--ease) both}
.crop::after{transform-origin:left;animation:cropX .7s .2s var(--ease) both}
@keyframes cropY{from{transform:scaleY(0)}}@keyframes cropX{from{transform:scaleX(0)}}
.colorbar i{transform-origin:bottom;animation:barIn .5s var(--ease) both}
@keyframes barIn{from{transform:scaleY(0)}}
.sheet{overflow:visible}
.sheet::before{content:"";position:absolute;inset:0;border-radius:4px;pointer-events:none;background:radial-gradient(600px 300px at var(--mx,70%) var(--my,30%),rgba(102,49,113,.07),transparent 70%);transition:background .2s}
/* press-run marquee */
.press{position:relative;z-index:1;overflow:hidden;padding:26px 0;border-block:1px solid var(--rule);background:color-mix(in oklab,var(--paper) 70%,transparent);margin:0}
.press-track{display:flex;width:max-content;animation:run 38s linear infinite}
.press:hover .press-track{animation-play-state:paused}
.press-track span{font-family:var(--display);font-weight:800;font-size:clamp(34px,4.4vw,60px);letter-spacing:-.02em;white-space:nowrap;padding-right:.6em;color:#dccbe1}
.press-track span:nth-child(4n+3){color:var(--plum)}
.press-track b{display:inline-block;color:var(--orange);-webkit-text-stroke:0;padding-right:.6em;animation:spin 6s linear infinite;font-weight:400}
@keyframes run{to{transform:translateX(-50%)}}
/* section headings: word stagger */
h2 .w{display:inline-block;opacity:0;transform:translateY(.6em) rotate(2deg);transition:opacity .7s var(--ease),transform .8s var(--ease)}
h2.in .w{opacity:1;transform:none}
h2.rv{opacity:1;transform:none}
.kicker::before{transform-origin:left;transform:scaleX(0);transition:transform .8s .15s var(--ease)}
.kicker.in::before{transform:scaleX(1)}
/* workflow progress inside active stage */
.stage[aria-selected="true"]::after{content:"";position:absolute;left:0;top:0;height:3px;background:var(--orange);width:0}
.flow.playing .stage[aria-selected="true"]::after{animation:fillw 4.2s linear forwards}
@keyframes fillw{to{width:100%}}
.flow{position:relative}
.flow::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:32px 32px;opacity:.35;mask-image:radial-gradient(ellipse at 80% 100%,#000,transparent 70%);animation:gridpan 20s linear infinite}
@keyframes gridpan{to{background-position:32px 32px}}
/* swatch ink sweep */
.swatch .chipc{overflow:hidden}
.swatch .chipc::before{content:"";position:absolute;inset:0;background:inherit;filter:brightness(1.18);transform:translateX(-101%);transition:transform 1s var(--ease)}
.swatch.in .chipc::before{animation:sheen 1.4s var(--ease) forwards;animation-delay:inherit}
@keyframes sheen{0%{transform:translateX(-101%)}60%{transform:translateX(0)}100%{transform:translateX(101%)}}
.swatch:hover .chipc::after{animation:spin 1.2s linear infinite;border-style:dashed}
/* dark catalog: ink blooms + scanline */
.cat{position:relative;overflow:hidden;isolation:isolate}
.cat::before,.cat::after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.55;pointer-events:none}
.cat::before{width:620px;height:620px;left:-160px;top:-120px;background:radial-gradient(circle,#663171,transparent 65%);animation:bloomA 18s ease-in-out infinite alternate}
.cat::after{width:520px;height:520px;right:-120px;bottom:-160px;background:radial-gradient(circle,#cf3a36,transparent 65%);opacity:.35;animation:bloomB 22s ease-in-out infinite alternate}
@keyframes bloomA{to{transform:translate(260px,180px) scale(1.25)}}
@keyframes bloomB{to{transform:translate(-280px,-120px) scale(1.15)}}
.term{position:relative}
.term::after{content:"";position:absolute;left:0;right:0;height:90px;top:-90px;pointer-events:none;background:linear-gradient(transparent,rgba(234,116,40,.07),transparent);animation:scan 6s linear infinite}
@keyframes scan{to{top:100%}}

@keyframes lnIn{to{opacity:1;transform:none}}
.codebox pre .ln:last-child::after{content:"\u258B";color:var(--orange);margin-left:4px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
/* ambient float on stamp when verified */
.proof[data-phase="fixed"] .stamp{animation:stampBob 5s 1s ease-in-out infinite}
@keyframes stampBob{0%,100%{transform:rotate(-14deg) scale(1)}50%{transform:rotate(-10deg) scale(1.03)}}

.agents{position:relative;z-index:1;padding:40px 0 24px}

.lane{overflow:hidden;padding:10px 0}
.lane-track{display:flex;gap:16px;width:max-content;animation:run 46s linear infinite}
.lane.rev .lane-track{animation-direction:reverse;animation-duration:54s}
.lanes:hover .lane-track,.lanes:focus-within .lane-track{animation-play-state:paused}
.agent{appearance:none;display:flex;align-items:center;gap:14px;padding:12px 22px 12px 12px;border-radius:18px;background:var(--sheet);border:1.5px solid var(--rule);font:600 17px var(--body);color:var(--ink);cursor:pointer;white-space:nowrap;transition:transform .35s var(--ease),border-color .25s,box-shadow .35s var(--ease),background .25s}
